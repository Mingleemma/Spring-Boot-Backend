name: Build and Deploy Spring Boot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Record deployment start
        run: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S %Z')] Deployment started" >> /home/ec2-user/newfile.txt

      - name: Update repository
        run: |
          cd /home/ec2-user/Spring-Boot-Backend
          git fetch origin
          git checkout main
          git pull origin main

      - name: Build application
        run: |
          cd /home/ec2-user/Spring-Boot-Backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Stop existing application
        run: |
          PID=$(pgrep -f "demo-0.0.1-SNAPSHOT.jar" || true)

          if [ -n "$PID" ]; then
            echo "Stopping application (PID: $PID)"
            kill "$PID"
            sleep 10
          else
            echo "No running application found."
          fi

      - name: Start application on port 8090
        run: |
          cd /home/ec2-user/Spring-Boot-Backend
          nohup java -jar target/demo-0.0.1-SNAPSHOT.jar --server.port=8090 > /home/ec2-user/spring-app.log 2>&1 &

      - name: Record deployment completion
        run: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S %Z')] Deployment completed" >> /home/ec2-user/newfile.txt
